name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all JS
        run: for f in js/*.js sw.js scripts/make-icons.js examples/*.js test/*.js; do node --check "$f" || exit 1; done
      - name: Run tests
        run: node --test
      - name: Verify icon PNGs are valid PNG files
        run: for f in icons/*.png; do sig=$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n'); [ "$sig" = "89504e470d0a1a0a" ] || (echo "bad png: $f" && exit 1); done
